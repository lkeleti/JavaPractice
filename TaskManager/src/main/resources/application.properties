spring.application.name=taskmanager
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

spring.jpa.show-sql=true

spring.datasource.url=jdbc:mariadb://localhost/taskmanager
spring.datasource.username=taskmanager
spring.datasource.password=taskmanager

spring.jpa.hibernate.ddl-auto=validate

logging.file.name=logs/taskmanager.log

logging.level.root=INFO
logging.level.dev.lkeleti.taskmanager=DEBUG

logging.pattern.console=%d{HH:mm:ss} [%level] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger - %msg%n

springdoc.swagger-ui.csrf.enabled=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true